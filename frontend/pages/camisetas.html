<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Camisetas Oversized | Sua Marca</title>
  <link rel="stylesheet" href="../styles/shared/vitrine-camisetas.css">
  <link rel="stylesheet" href="../styles/shared/responsive.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <section class="hero">
    <h1>CAMISETAS OVERSIZED</h1>
    <p>Modelagem ampla • Conforto premium • Streetwear</p>
  </section>

  <section class="products">

    <div class="product-card">
      <span class="tag">-20%</span>
      <picture>
        <source srcset="../img/camisa1.webp" type="image/webp">
        <img src="../img/camisa1.png" alt="Camiseta Oversized Face">
      </picture>
      <h3>Oversized Face</h3>
      <p class="price">R$ 129,90</p>
      <button>COMPRAR</button>
    </div>

    <div class="product-card">
      <picture>
        <source srcset="../img/camisa2.webp" type="image/webp">
        <img src="../img/camisa2.png" alt="Camiseta Oversized Flame">
      </picture>
      <h3>Oversized Flame</h3>
      <p class="price">R$ 139,90</p>
      <button>COMPRAR</button>
    </div>

    <div class="product-card">
      <span class="tag yellow">3 POR 199</span>
      <picture>
        <source srcset="../img/camisa3.webp" type="image/webp">
        <img src="../img/camisa3.png" alt="Camiseta Oversized Minimal">
      </picture>
      <h3>Oversized Minimal</h3>
      <p class="price">R$ 129,90</p>
      <button>COMPRAR</button>
    </div>

    <div class="product-card">
      <picture>
        <source srcset="../img/camisa4.webp" type="image/webp">
        <img src="../img/camisa4.png" alt="Camiseta Oversized Graphic">
      </picture>
      <h3>Oversized Graphic</h3>
      <p class="price">R$ 149,90</p>
      <button>COMPRAR</button>
    </div>

  </section>

</body>
</html>
